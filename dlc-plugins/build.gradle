plugins {
    id 'java-library'
    id 'maven-publish'
    id 'checkstyle'
    alias libs.plugins.yumi.gradle.licenser.plugin
    alias libs.plugins.jaredsburrows.license.plugin
}

java {
    withJavadocJar()
    withSourcesJar()
}

dependencies {
    implementation gradleApi()
    implementation libs.docker.java.core
    implementation libs.docker.java.transport.httpclient5
    implementation project(":mirror-jmolecules")
    implementation libs.jmolecules.ddd
    implementation libs.jmolecules.events
    implementation project(":mirror-serialization-jackson3")
    implementation project(":types")
    implementation project(":domain-diagrammer")
    implementation project(":static-analysis-sootup")
    implementation project(":static-analysis-serialization-jackson3")
    api libs.slf4j.api

    testImplementation libs.assertj
    testImplementation libs.logback.classic
    testImplementation project(":assertions")
    testImplementation project(":builder")
    testImplementation project(":access")
    testImplementation project(":type-utils")
    testImplementation project(":test-shared-impl")
    testAnnotationProcessor libs.lombok
}
